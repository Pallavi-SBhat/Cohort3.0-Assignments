<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="800" fill="#0D121D"/>
  
  <!-- Subtle Blueprint Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(173,186,205,0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="curveGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DDC97" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DDC97" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#grid)" />

  <!-- Top App Chrome Header -->
  <rect x="60" y="60" width="1160" height="680" rx="12" fill="#141B28" stroke="rgba(173,186,205,0.15)" stroke-width="1.5"/>
  <rect x="60" y="60" width="1160" height="54" rx="12" fill="#0B101A"/>
  <circle cx="95" cy="87" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="115" cy="87" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="135" cy="87" r="6" fill="#10b981" opacity="0.8"/>
  <text x="540" y="92" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="500">models/supervised_classifier.py — CodeLab Systems</text>
  <rect x="1100" y="74" width="90" height="26" rx="4" fill="#3DDC97" fill-opacity="0.12" stroke="#3DDC97" stroke-opacity="0.4"/>
  <text x="1118" y="91" fill="#3DDC97" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">● TRAINED</text>

  <!-- Left Column: Metrics & Architecture -->
  <rect x="95" y="145" width="340" height="560" rx="8" fill="#0B101A" stroke="rgba(173,186,205,0.1)"/>
  <text x="120" y="185" fill="#E8EAED" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Model Performance</text>
  <text x="120" y="205" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">Random Forest &amp; Logistic Regression</text>

  <!-- Metric Badges -->
  <rect x="120" y="235" width="135" height="75" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="135" y="260" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">ROC-AUC SCORE</text>
  <text x="135" y="293" fill="#3DDC97" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="700">0.942</text>

  <rect x="275" y="235" width="135" height="75" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="290" y="260" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">ACCURACY</text>
  <text x="290" y="293" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="700">92.8%</text>

  <rect x="120" y="325" width="135" height="75" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="135" y="350" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">PRECISION</text>
  <text x="135" y="383" fill="#E8EAED" font-family="'IBM Plex Mono', monospace" font-size="22" font-weight="700">91.4%</text>

  <rect x="275" y="325" width="135" height="75" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="290" y="350" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">RECALL</text>
  <text x="290" y="383" fill="#E8EAED" font-family="'IBM Plex Mono', monospace" font-size="22" font-weight="700">89.6%</text>

  <!-- Confusion Matrix Box -->
  <rect x="120" y="425" width="290" height="245" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="140" y="455" fill="#E8EAED" font-family="'Manrope', sans-serif" font-size="13" font-weight="600">Confusion Matrix Analysis</text>
  <rect x="140" y="480" width="120" height="75" fill="#3DDC97" fill-opacity="0.25" stroke="#3DDC97" stroke-opacity="0.5" rx="4"/>
  <text x="175" y="515" fill="#3DDC97" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700">TP: 842</text>
  <text x="165" y="535" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="10">True Positive</text>

  <rect x="270" y="480" width="120" height="75" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3" rx="4"/>
  <text x="310" y="515" fill="#f87171" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700">FP: 48</text>
  <text x="295" y="535" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="10">False Positive</text>

  <rect x="140" y="565" width="120" height="75" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3" rx="4"/>
  <text x="180" y="600" fill="#f87171" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700">FN: 52</text>
  <text x="165" y="620" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="10">False Negative</text>

  <rect x="270" y="565" width="120" height="75" fill="#3DDC97" fill-opacity="0.25" stroke="#3DDC97" stroke-opacity="0.5" rx="4"/>
  <text x="305" y="600" fill="#3DDC97" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700">TN: 914</text>
  <text x="295" y="620" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="10">True Negative</text>

  <!-- Right Column: ROC Curve & Feature Weights -->
  <rect x="460" y="145" width="730" height="560" rx="8" fill="#0B101A" stroke="rgba(173,186,205,0.1)"/>
  <text x="495" y="185" fill="#E8EAED" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">ROC Curve &amp; Probability Distribution</text>
  <text x="495" y="205" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">Sensitivity vs. 1 - Specificity (Evaluated on Test Callset)</text>

  <!-- Graph Axis Area -->
  <line x1="530" y1="250" x2="530" y2="580" stroke="rgba(173,186,205,0.3)" stroke-width="1.5"/>
  <line x1="530" y1="580" x2="1140" y2="580" stroke="rgba(173,186,205,0.3)" stroke-width="1.5"/>

  <!-- Grid lines -->
  <line x1="530" y1="332" x2="1140" y2="332" stroke="rgba(173,186,205,0.08)" stroke-dasharray="4 4"/>
  <line x1="530" y1="415" x2="1140" y2="415" stroke="rgba(173,186,205,0.08)" stroke-dasharray="4 4"/>
  <line x1="530" y1="497" x2="1140" y2="497" stroke="rgba(173,186,205,0.08)" stroke-dasharray="4 4"/>

  <!-- Baseline Diagonal -->
  <line x1="530" y1="580" x2="1140" y2="250" stroke="#858E9C" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- ROC Area & Curve -->
  <path d="M 530 580 C 560 380, 680 270, 1140 250 L 1140 580 Z" fill="url(#areaGradient)"/>
  <path d="M 530 580 C 560 380, 680 270, 1140 250" fill="none" stroke="url(#curveGradient)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Axis Labels -->
  <text x="500" y="255" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">1.0</text>
  <text x="500" y="415" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">0.5</text>
  <text x="500" y="585" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">0.0</text>
  <text x="530" y="605" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">0.0</text>
  <text x="820" y="605" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">0.5 False Positive Rate</text>
  <text x="1120" y="605" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">1.0</text>

  <!-- Feature importance tag list at bottom -->
  <rect x="495" y="635" width="665" height="45" rx="6" fill="#141B28" stroke="rgba(173,186,205,0.12)"/>
  <text x="515" y="662" fill="#858E9C" font-family="'IBM Plex Mono', monospace" font-size="11">Key Features Evaluated:</text>
  <text x="685" y="662" fill="#3DDC97" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">Contract Type (0.28) • Monthly Charges (0.22) • Tenure (0.19) • Glucose Level (0.17)</text>
</svg>

