<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Explorer Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">

    <!-- Header -->

    <header>

        <div>
            <h1>Task Manager</h1>
            <p class="subtitle">
                Manage your daily tasks efficiently
            </p>
        </div>

        <div class="header-buttons">

            <button id="themeBtn" class="btn theme-btn">
                🌙 Dark Mode
            </button>

            <button id="createBtn" class="btn create-btn">
                + Create Task
            </button>

        </div>

    </header>

    <!-- Task Counter -->

    <section class="stats">

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>

    </section>

    <!-- Task Area -->

    <main>

        <div id="taskContainer" class="task-grid">

            <!-- Tasks created dynamically -->

        </div>

    </main>

    <!-- Popup Form -->

    <div id="formContainer" class="popup">

        <div class="popup-card">

            <div class="popup-header">

                <h2>Create Task</h2>

                <span id="closeBtn">✖</span>

            </div>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter Task Title"
                    required>

                <select id="taskCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Development">
                        Development
                    </option>

                    <option value="Study">
                        Study
                    </option>

                    <option value="Work">
                        Work
                    </option>

                    <option value="Health">
                        Health & Fitness
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Goals">
                        Goals
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                </select>

                <select id="taskStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

                <button type="submit" class="btn create-btn">
                    Save Task
                </button>

            </form>

        </div>

    </div>

    <!-- Attributes vs Properties -->

    <section class="demo-section">

        <h2>Attributes vs Properties</h2>

        <input
            type="text"
            id="demoInput"
            value="Original Value">

        <button id="checkAttribute" class="btn">
            Check Console
        </button>

    </section>

    <!-- Event Bubbling / Capturing -->

    <section class="demo-section">

        <h2>Event Bubbling & Capturing Demo</h2>

        <div id="grandparent" class="grandparent">

            Grandparent

            <div id="parent" class="parent">

                Parent

                <button id="childBtn">
                    Child Button
                </button>

            </div>

        </div>

    </section>

    <!-- Browser Rendering Pipeline -->

    <section class="demo-section">

        <h2>Browser Rendering Pipeline</h2>

        <div class="pipeline">

            <div class="pipeline-box">HTML</div>
            <div class="arrow">↓</div>

            <div class="pipeline-box">Parsing</div>
            <div class="arrow">↓</div>

            <div class="pipeline-box">Tokenization</div>
            <div class="arrow">↓</div>

            <div class="pipeline-box">DOM Tree</div>
            <div class="arrow">↓</div>

            <div class="pipeline-box">CSSOM Tree</div>
            <div class="arrow">↓</div>

            <div class="pipeline-box">Render Tree</div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
