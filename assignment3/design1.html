<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Artwork</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,body{
      width: 100%;
      height: 100%;
    }

    body{
      background: linear-gradient(to right,#6a0d6d,#14003d,#6a0d6d);
      min-height: 100vh;
      padding: 40px 60px;
      overflow-x: hidden;
    }

    .top{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .top h1{
      color: white;
      font-size: 32px;
      font-weight: 600;
    }

    .top p{
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .container{
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 40px;
    }

    .card{
      background-color: rgba(180, 141, 205, 0.35);
      padding: 20px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
    }

    .card img{
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.6);
    }

    .content{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      color: white;
    }

    .content h3{
      font-size: 22px;
      font-weight: 500;
    }

    .likes{
      font-size: 14px;
      opacity: 0.8;
    }

    button{
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border-radius: 40px;
      border: 3px solid #d276ff;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background-color: #d276ff;
    }

    @media(max-width:1100px){

      .container{
        grid-template-columns: repeat(2,1fr);
      }

    }

    @media(max-width:650px){

      body{
        padding: 20px;
      }

      .container{
        grid-template-columns: 1fr;
      }

      .top h1{
        font-size: 24px;
      }

    }

  </style>

</head>

<body>

  <div class="top">
    <h1>Explore Art Work</h1>
    <p>See All</p>
  </div>

  <div class="container">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1635322966219-b75ed372eb01?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Monocular</h3>
        <span class="likes">84.8k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1611605698335-8b1569810432?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Horns Mask</h3>
        <span class="likes">32.4k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Light Moon</h3>
        <span class="likes">66.8k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1638803040283-7a5ffd48dad5?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Skull Wire</h3>
        <span class="likes">78.9k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1624561172888-ac93c696e10c?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Spiderman</h3>
        <span class="likes">24.8k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://imgs.search.brave.com/Z8fpiqdFfgWibXy5AwbnsW1gQ0M9bpqcGLDpUkKTyXs/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWFn/ZXMudW5zcGxhc2gu/Y29tL3Bob3RvLTE2/NDA4Njk0NDQ2MDEt/ZTc5MWM0MWJhZTZi/P2ZtPWpwZyZxPTYw/Jnc9MzAwMCZhdXRv/PWZvcm1hdCZmaXQ9/Y3JvcCZpeGxpYj1y/Yi00LjEuMCZpeGlk/PU0zd3hNakEzZkRC/OE1IeHpaV0Z5WTJo/OE1URjhmRzFoYzJ0/OFpXNThNSHg4TUh4/OGZEQT0" alt="">
      <div class="content">
        <h3>DeadPool</h3>
        <span class="likes">59.7k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1608889175123-8ee362201f81?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>White Eye</h3>
        <span class="likes">45.7k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1635321593217-40050ad13c74?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="content">
        <h3>Plastic Spinal</h3>
        <span class="likes">98.6k ♡</span>
      </div>
      <button>Place Bid</button>
    </div>

  </div>

</body>
</html>
