<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">

    <header>

        <div>
            <h1>Task Manager</h1>
            <p class="subtitle">
                Organize and manage your daily tasks
            </p>
        </div>

        <div class="header-buttons">

            <button id="themeBtn" class="btn theme-btn">
                🌙 Dark Mode
            </button>

            <a href="concepts.html">
                <button class="btn concept-btn">
                    DOM Concepts
                </button>
            </a>

            <button id="createBtn" class="btn create-btn">
                + Create Task
            </button>

        </div>

    </header>

    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">

            <h3>Total Tasks</h3>

            <p id="totalTasks">
                0
            </p>

        </div>

        <div class="stat-card">

            <h3>Completed</h3>

            <p id="completedTasks">
                0
            </p>

        </div>

        <div class="stat-card">

            <h3>Pending</h3>

            <p id="pendingTasks">
                0
            </p>

        </div>

    </section>

    <!-- Task Container -->

    <main>

        <div id="taskContainer" class="task-grid">

            <!-- Tasks Added Dynamically -->

        </div>

    </main>

    <!-- Popup Form -->

    <div id="formContainer" class="popup">

        <div class="popup-card">

            <div class="popup-header">

                <h2>Create Task</h2>

                <span id="closeBtn">
                    ✖
                </span>

            </div>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter Task Title"
                    required>

                <select id="taskCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Development">
                        Development
                    </option>

                    <option value="Study">
                        Study
                    </option>

                    <option value="Work">
                        Work
                    </option>

                    <option value="Health">
                        Health & Fitness
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Goals">
                        Goals
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                </select>

                <select id="taskStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

                <button
                    type="submit"
                    class="btn create-btn">

                    Save Task

                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
